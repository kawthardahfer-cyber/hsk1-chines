.lesson-list{margin-top:12px;border-top:1px solid #2b3343;padding-top:9px}
.lesson-list>div{color:#8791a6;font-size:12px;padding:7px 9px}
.lesson-list button{font-size:13px}
main,#main{flex:1;min-width:0;padding:28px 30px 55px;overflow-x:hidden}
.top,.course-head,.section-title,.notice,.hero,.source-grid,.grid,.vocab,.stats,.two-col,.hanzi-layout,.hanzi-pages,.card,.source-grid,.source-row{max-width:1200px}
.top,.course-head{margin:0 auto 18px;display:flex;justify-content:space-between;gap:18px;align-items:flex-start}
.top h1,.course-head h1{margin:0;font-size:31px;line-height:1.35}
.subtitle{color:var(--muted);font-size:14px;line-height:1.8}
.grid{margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.vocab{margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.source-grid{margin:0 auto;display:grid;grid-template-columns:1fr;gap:14px}
.card{width:100%;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 7px 24px rgba(19,31,51,.05)}
.hero{background:linear-gradient(135deg,#fff,#fff5ef);border-color:#ffd8ca}
.progress{height:9px;background:#edf0f5;border-radius:20px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:10px;padding:10px 14px;background:var(--brand);color:#fff;font-weight:700;text-decoration:none}
.btn.alt{background:#edf1f7;color:#283246}
.btn.ok{background:var(--ok)}
.pill{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;background:#f0f3f7;color:#4d5768;font-size:11px;font-weight:700}
.tag{display:inline-block;background:#f2f4f7;padding:4px 8px;border-radius:7px;font-size:11px;margin:2px}
.zh,.hanzi,.selected-char,.hc-char{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;direction:ltr}
.hanzi{font-size:38px;font-weight:800}
.pinyin{color:#65708a;font-size:16px;direction:ltr}
.section-title{margin:28px auto 12px;font-size:22px}

.notice.info{background:#f1f6ff;border-color:#d9e5fb;color:#30537d}
.source{font-size:12px;color:#6e7686;border-top:1px dashed #e9ebef;padding-top:9px;margin-top:9px;line-height:1.8}
.source-grid .source-row{max-width:none}
.source-row{border-bottom:1px solid #e8ebf0;padding:10px 0}
.source-row summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
.source-text{margin-top:10px;padding:12px;background:#fbfcfe;border:1px solid #edf0f4;border-radius:10px;max-height:460px;overflow:auto}
.source-line{padding:6px 1px;border-bottom:1px dashed #e7e9ee;line-height:1.8;white-space:pre-wrap}
.zh-source{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;direction:ltr;text-align:left}
.speak{background:#eef5ff;color:#315bd6;border:0;border-radius:9px;padding:7px}
.inline-speak{margin-inline-start:6px}
.option{display:block;width:100%;text-align:right;padding:11px;margin:7px 0;border:1px solid #e4e8ee;background:#fff;border-radius:10px}
.feedback{margin-top:10px;padding:10px;border-radius:10px;background:#eef8f2;color:var(--ok)}
.okfb{background:#eef8f2;color:var(--ok)}
.badfb{background:#fff1f1;color:var(--bad)}
.hanzi-layout{margin:14px auto 0;display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;direction:ltr}
.hanzi-panel{background:var(--dark);color:#fff;border-radius:16px;padding:16px;height:fit-content;position:sticky;top:20px;direction:rtl}
.hanzi-panel h2{margin:0}
.hanzi-panel input{width:100%;margin:10px 0;padding:10px;border:1px solid #394153;background:#202736;color:#fff;border-radius:10px}
.hanzi-list{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:620px;overflow:auto}
.hc-tile{border:1px solid #333b4c;background:#202736;color:#fff;border-radius:8px;padding:7px}

.hanzi-work{min-width:0;direction:rtl}
.hanzi-selected{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center}
.selected-char{font:800 100px "Noto Sans SC","Microsoft YaHei",sans-serif;line-height:1.05}
.writer{width:230px;height:230px;margin:10px auto}
.hanzi-pages{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
.page-rows{margin-top:8px}
.hanzi-row{width:100%;border:0;border-bottom:1px solid #edf0f3;background:#fff;padding:10px 4px;display:grid;grid-template-columns:70px 1fr 1fr;align-items:center;text-align:right}
.hc-char{font:700 30px "Noto Sans SC","Microsoft YaHei",sans-serif}
.hc-pinyin{direction:ltr;text-align:left;color:#687286}
.hc-meta{color:#98a0af;font-size:12px}
.two-col{margin:0 auto;display:grid;grid-template-columns:1.1fr .9fr;gap:12px}
.stats{margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px}

hr{border:0;border-top:1px solid #eceff3;margin:14px 0}

  .hanzi-layout,.two-col{grid-template-columns:1fr}

}

"story":{"title":"القطة الجائعة — 饥饿的猫","hanzi":"我是猫。我一岁了。我喜欢吃东西。我也喜欢睡觉。星期一，我在商店吃饭，我在学校睡觉。星期二，商店没有饭。我在学校吃饭，我在饭店睡觉。星期三，商店没有饭，学校也没有饭。我在饭店吃饭，我在医院睡觉。","pinyin":"Wǒ shì māo. Wǒ yī suì le. Wǒ xǐhuān chī dōngxi. Wǒ yě xǐhuān shuìjiào. Xīngqī yī, wǒ zài shāngdiàn chīfàn, wǒ zài xuéxiào shuìjiào.","ar":"أنا قطة. عمري سنة واحدة. أحب الأكل وأحب النوم أيضًا. يوم الاثنين آكل في المتجر وأنام في المدرسة. يوم الثلاثاء لا يوجد طعام في المتجر، فأكل في المدرسة وأنام في المطعم. يوم الأربعاء لا يوجد طعام في المتجر ولا في المدرسة، فأكل في المطعم وأنام في المستشفى.","en":"I am a cat. I am one year old. I like eating and I also like sleeping. On Monday I eat at the shop and sleep at school. On Tuesday there is no food at the shop, so I eat at school and sleep at the restaurant. On Wednesday there is no food at the shop or school, so I eat at the restaurant and sleep at the hospital."},

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function speak(t){let u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u)}
function prog(){let lessonsDone=Object.values(state.mastered).filter(Boolean).length;let charsDone=Object.values(state.chars).filter(v=>v>=2).length;let phrasesDone=Object.values(state.phrases).filter(v=>v>=2).length;let base=15+(SRC.book900.unique_characters||[]).length+(SRC.book900.phrase_cards_extracted||[]).length;return Math.min(100,Math.round(((lessonsDone+charsDone+phrasesDone)/Math.max(1,base))*100))}

function home(){document.getElementById('main').innerHTML=`<div class="top"><div><h1>أهلاً بك في 中文小屋 👋</h1><div class="subtitle">نفس تصميم المنصة مع بنية دروس مرتبطة بصفحات المصدر الفعلية.</div></div><span class="pill">التقدم ${prog()}%</span></div><div class="card hero"><h2>المواد الآن مفصولة حسب الدرس الحقيقي</h2><p>كل درس يعرض صفحاته الخاصة من كتاب 新HSK教程1 وتمارينه الخاصة من كتاب التمارين، مع الصوت والـHanzi والتقدم.</p><div class="progress"><i style="width:${prog()}%"></i></div><div class="row" style="margin-top:14px"><button class="btn" onclick="lesson(1)">ابدأ الدرس 1</button><button class="btn alt" onclick="hanziCourse()">ابدأ دورة Hanzi</button><button class="btn alt" onclick="nine()">ابدأ 900 عبارة</button></div></div><h2 class="section-title">خريطة الدورة</h2><div class="grid">${D.lessons.map(x=>`<div class="card"><span class="pill">Lesson ${x.id}</span><h3 class="zh">${x.title}</h3><div>${x.ar}</div><p class="subtitle">${x.en}</p><div>${x.grammar.split('،').map(t=>`<span class="tag">${t}</span>`).join('')}</div><button class="btn alt" style="margin-top:10px" onclick="lesson(${x.id})">فتح الدرس</button></div>`).join('')}</div><h2 class="section-title">المصادر</h2><div class="grid">${D.sources.map(s=>`<div class="card"><b>${s.name}</b><p>${s.note}</p><div class="source">${s.pages}</div></div>`).join('')}</div>`}
function word(v){let mastered=(state.words[v.hanzi]||0)>=3;return `<div class="card"><div class="row"><div class="hanzi zh">${v.hanzi}</div><button class="speak" onclick="speak('${esc(v.hanzi)}')">🔊</button></div><div class="pinyin">${v.pinyin}</div><b>${v.ar}</b><div class="subtitle">${v.en}</div><hr><div class="zh" style="font-size:20px">${v.sentence}</div><div class="pinyin">${v.sp}</div><div>${v.sar}</div><div class="subtitle">${v.sen}</div><button class="btn alt" onclick="speak('${esc(v.sentence)}')">استمع للجملة</button> <button class="btn alt" onclick="state.words['${esc(v.hanzi)}']=(state.words['${esc(v.hanzi)}']||0)+1;save();vocabPage()">${mastered?'✓ متقن':'أعرفها'}</button></div>`}
function sourceTextBlock(text){return text.split('\n').map(x=>x.trim()).filter(Boolean).map((x,i)=>{let hasHan=()=>/[/一-龥\u3400-\u9fff]/.test(x);return `<div class="source-line ${hasHan()?'zh-source':''}">${esc(x)} ${/[\u3400-\u9fff]/.test(x)?`<button class="speak inline-speak" onclick="speak('${esc(x.replace(/\s+/g,''))}')">🔊</button>`:''}</div>`}).join('')}
function sourcePageCard(p,kind){let key=kind+'_'+p.pdf_page;let done=!!state.sourceExercises[key];return `<div class="card source-page"><div class="row"><span class="pill">${kind==='textbook'?'كتاب الدرس':'كتاب التمارين'} — ملف PDF ${p.pdf_page}</span><button class="btn alt" onclick="togglePage('pg_${kind}_${p.pdf_page}')">${done?'✓ تمت المراجعة':'وضعها كمراجَعة'}</button></div><div id="pg_${kind}_${p.pdf_page}" class="source-text">${sourceTextBlock(p.text)}</div></div>`}
function togglePage(k){state.sourceExercises[k]=!state.sourceExercises[k];save();document.getElementById('main').dataset.rerender='1';document.querySelector(`[onclick="togglePage('${k}')"]`)?.replaceWith(document.querySelector(`[onclick="togglePage('${k}')"]`));location.reload()}
function lesson(id){let l=D.lessons[id-1],src=SRC.lessons.find(x=>x.id===id);state.mastered[id]=!!state.mastered[id];save();let textbookPages=src?.textbook_pages||[],workbookPages=src?.workbook_pages||[];document.getElementById('main').innerHTML=`<div class="top"><div><span class="pill">الدرس ${id}</span><h1 class="zh">${l.title}</h1><div class="subtitle">${l.en} — ${l.ar}</div><div class="source">المصدر الفعلي: كتاب PDF صفحات ${src?.textbook_range?.join('–')||'—'}، وكتاب التمارين صفحات ${src?.workbook_range?.join('–')||'—'}</div></div><button class="btn ok" onclick="state.mastered[${id}]=true;save();lesson(${id})">${state.mastered[id]?'✓ مكتمل':'وضع علامة كمكتمل'}</button></div><div class="grid"><div class="card"><h3>🎯 هدف الدرس</h3><p>${l.ar}</p><p class="subtitle">${l.grammar}</p></div><div class="card"><h3>🎧 الاستماع</h3><p>يمكنك تشغيل العنوان وأي سطر صيني من المصدر.</p><button class="btn" onclick="speak('${esc(l.title)}')">▶ استمع للعنوان</button></div></div><h2 class="section-title">📖 المحتوى الأصلي للدرس — صفحة بصفحة</h2><div class="grid source-grid">${textbookPages.map(p=>sourcePageCard(p,'textbook')).join('')}</div><h2 class="section-title">📝 تمارين كتاب التمارين الخاصة بهذا الدرس</h2><div class="notice">هذه الصفحات تخص هذا الدرس فقط. لا يتم خلطها مع بقية الدروس. لأن ملف كتاب التمارين نفسه لا يتضمن مفتاح إجابة كاملًا داخل الصفحات المرفوعة، يحتفظ الموقع بالنص الأصلي ويتيح لك الكتابة والمراجعة بدل اختلاق حلول غير موجودة في المصدر.</div><div class="grid source-grid">${workbookPages.map(p=>sourcePageCard(p,'workbook')).join('')}</div><h2 class="section-title">📚 مفردات الموقع الأصلية الحالية</h2><div class="vocab">${D.vocab.slice(0,id===1?12:Math.min(D.vocab.length,Math.max(4,id))).map(word).join('')}</div>`}
function basics(){document.getElementById('main').innerHTML=`<div class="top"><div><h1>🔤 أساسيات الصينية</h1><div class="subtitle">Pinyin → 声母 → 韵母 → 声调 → Hanzi</div></div></div><div class="grid"><div class="card"><h2>Pinyin</h2><p>المادة الأصلية في 900句汉语 تشرح أن المقطع يتكوّن من 声母 و韵母 و声调، ثم تشرح قواعد التحويل والعلامات.</p><button class="btn" onclick="speak('你好')">استمع: 你好</button></div><div class="card"><h2>声母</h2><p class="zh">b p m f d t n l g k h j q x zh ch sh r z c s</p></div><div class="card"><h2>韵母</h2><p class="zh">a o e i u ü ai ei ao ou an en ang eng ong er</p></div></div><h2 class="section-title">✍️ كتابة Hanzi</h2><div class="card"><p>تدرّب على ترتيب الضربات ثم اكتب الحرف بنفسك.</p><div id="writer" class="writer"></div><div class="row"><button class="btn" onclick="writer('你')">你</button><button class="btn alt" onclick="writer('好')">好</button><button class="btn alt" onclick="writer('学')">学</button><button class="btn alt" onclick="writer('生')">生</button></div></div>`;writer('你')}

function tones(){let t=[['1','النغمة الأولى','mā','مستقيمة وعالية'],['2','النغمة الثانية','má','تصعد'],['3','النغمة الثالثة','mǎ','تنخفض ثم تصعد'],['4','النغمة الرابعة','mà','تهبط بقوة'],['5','الخفيفة','ma','قصيرة وخفيفة']];document.getElementById('main').innerHTML=`<div class="top"><div><h1>🎵 النغمات الصينية</h1><div class="subtitle">الأربع نغمات + النغمة الخفيفة</div></div></div><div class="grid">${t.map(x=>`<div class="card"><span class="pill">${x[0]}</span><h2>${x[1]}</h2><p>${x[3]}</p><div class="hanzi zh">${x[2]}</div><button class="btn" onclick="speak('${x[2]}')">🔊 اسمع</button></div>`).join('')}</div><h2 class="section-title">اختبار سريع</h2><div class="card"><button class="btn" onclick="speak('mǎ')">🔊 شغّل mǎ</button>${[1,2,3,4].map(n=>`<button class="option" onclick="tone(${n})">النغمة ${n}</button>`).join('')}<div id="tf" class="feedback"></div></div><div class="notice">تقييم النغمات من الميكروفون يحتاج نموذج نطق متخصص؛ الموقع لا يدّعي دقة غير موثوقة.</div>`}

function hanziCourse(){let items=window.HSK1_WRITING?.items||[],pages=window.HSK1_WRITING?.pages||{};document.getElementById('main').innerHTML=`<div class="course-head"><div><span class="pill">Hanzi · 笔顺 · 写字</span><h1>✍️ دورة Hanzi — ملف HSK 1 الجديد</h1><p class="subtitle">تحويل صفحات كتابة الحروف من الـPDF إلى تدريب تفاعلي.</p></div><a class="btn alt" href="${esc(window.HSK1_WRITING.sourcePdf)}" target="_blank">فتح PDF الأصلي</a></div><div class="notice info">الغلاف يذكر <b>184 字</b>. الصفحات 2–28 تحتوي صفوف كتابة مع Pinyin؛ الحروف أدناه مرتبطة بصفحة المصدر نفسها، وتستطيعين مشاهدة ترتيب الضربات واختبار كتابتك.</div><div class="hanzi-layout"><aside class="hanzi-panel"><h2>الحروف</h2><input id="hcSearch" type="text" placeholder="ابحثي بالحرف أو Pinyin" oninput="filterHanzi(this.value)"><div id="hcList" class="hanzi-list"></div></aside><section class="hanzi-work"><div class="hanzi-selected"><div class="selected-char" id="selChar">一</div><div class="pinyin" id="selPy">yī · PDF 2</div><div id="hcWriter" class="writer"></div><div class="row"><button class="btn" onclick="showStrokeOrder()">▶ ترتيب الضربات</button><button class="btn alt" onclick="quizHanzi()">✍ اختبر كتابتي</button><button class="btn alt" onclick="speak(document.getElementById('selChar').textContent)">🔊 استمع</button></div><div id="hcFeedback" class="feedback"></div></div><div class="hanzi-pages"><h2>صفحات الملف</h2>${Object.entries(pages).map(([pg,arr])=>`<details class="source-row"><summary><span><span class="pill">ملف PDF ${pg}</span> ${arr.length} أهداف كتابة</span><span>عرض ▾</span></summary><div class="page-rows">${arr.map(([c,py])=>`<button class="hanzi-row" onclick="selectHanzi('${c}','${py}',${pg})"><span class="hc-char">${c}</span><span class="hc-pinyin">${py}</span><span class="hc-meta">فتح التدريب ←</span></button>`).join('')}</div></details>`).join('')}</div></section></div>`;renderHanziList('');selectHanzi(items[0]?.hanzi||'一',items[0]?.pinyin||'yī',items[0]?.page||2)}

function esc2(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;')}
function zhClean(s){let x=String(s||'').trim(); for(let i=0;i<3;i++) x=x.replace(/([\u3400-\u9fff])\s+(?=[\u3400-\u9fff])/g,'$1'); return x;}
function srcFor(id){return SRC.lessons.find(x=>x.id===id)||{} }
function lessonSourceText(id){const s=srcFor(id); return [...(s.textbook_pages||[]),...(s.workbook_pages||[])].map(p=>p.text||'').join('\n');}
function lessonVocab(id){const txt=lessonSourceText(id); const arr=(D.vocab||[]).filter(v=>v.hanzi && (txt.includes(v.hanzi) || (v.sentence&&txt.includes(v.sentence)))); return arr.length?arr.slice(0,18):[]}
function lessonChars(id){const txt=lessonSourceText(id); const items=window.HSK1_WRITING?.items||[]; const seen=new Set(); const out=[]; items.forEach(x=>{ if(txt.includes(x.hanzi) && !seen.has(x.hanzi)){seen.add(x.hanzi);out.push(x)} }); return out;}

function translateUiText(txt){

  t=t.replace(/\bLesson\s+(\d+)\b/g,'الدرس $1')
     .replace(/\bWorkbook\b/g,'كتاب التمارين')

function applyArabicUI(root=document.body){
  const skip='.zh,.pinyin,.zh-source,.source-content,.raw-lines,.source-line,.source-text,.source,.original-source,pre,code,script,style,input,textarea,select,option';
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
    const el=n.parentElement; if(!el||el.closest(skip)) return NodeFilter.FILTER_REJECT;
    const raw=n.nodeValue; if(!raw||!raw.trim()) return NodeFilter.FILTER_REJECT;
    // Do not translate long English source/learning content accidentally.
    if(raw.trim().length>120 && /[A-Za-z]{3,}/.test(raw) && !/\b(Lesson|Workbook|PDF|Hanzi|Pinyin|English|Page|Source)\b/.test(raw)) return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT;
  }});
  const nodes=[]; let n; while(n=walker.nextNode()) nodes.push(n);
  nodes.forEach(node=>{const next=translateUiText(node.nodeValue); if(next!==node.nodeValue) node.nodeValue=next;});
}
function startArabicUITranslation(){
  applyArabicUI();
  const obs=new MutationObserver(()=>applyArabicUI());
  obs.observe(document.getElementById('main')||document.body,{childList:true,subtree:true});
}

// Override the old boot with the source-first engine.
function initCorrected(){modernNav();homeModern();startArabicUITranslation();}
window.addEventListener('DOMContentLoaded',()=>{if(document.getElementById('nav')&&document.getElementById('main'))initCorrected();});
</script></body></html>
