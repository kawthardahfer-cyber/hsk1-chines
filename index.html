<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة تعلم اللغة الصينية - Chinese Learning Platform</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f3f4f6; }
        .char-large { font-size: 3rem; }
        .card-hover { transition: all 0.3s ease; }
        .card-hover:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        canvas { border: 2px solid #3b82f6; cursor: crosshair; }
        button { font-family: inherit; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;
        const { BookOpen, Menu, X, Volume2 } = {
            BookOpen: () => <span>📚</span>,
            Menu: () => <span>☰</span>,
            X: () => <span>✕</span>,
            Volume2: () => <span>🔊</span>
        };

        const ChineseLearningSite = () => {
            const [currentSection, setCurrentSection] = useState('home');
            const [menuOpen, setMenuOpen] = useState(false);
            const [selectedWord, setSelectedWord] = useState(null);
            const [selectedLesson, setSelectedLesson] = useState(null);
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);

            const vocabularyData = [
                { hanzi: '你', pinyin: 'nǐ', arabic: 'أنت', english: 'you', category: 'ضمير' },
                { hanzi: '好', pinyin: 'hǎo', arabic: 'جيد', english: 'good', category: 'صفة' },
                { hanzi: '谢谢', pinyin: 'xièxie', arabic: 'شكراً', english: 'thank you', category: 'تعبير' },
                { hanzi: '再见', pinyin: 'zàijiàn', arabic: 'وداعاً', english: 'goodbye', category: 'تعبير' },
                { hanzi: '对不起', pinyin: 'duìbùqǐ', arabic: 'آسف', english: 'sorry', category: 'تعبير' },
                { hanzi: '没关系', pinyin: 'méiguānxì', arabic: 'لا مشكلة', english: 'never mind', category: 'تعبير' },
                { hanzi: '请', pinyin: 'qǐng', arabic: 'من فضلك', english: 'please', category: 'تعبير' },
                { hanzi: '是', pinyin: 'shì', arabic: 'يكون', english: 'is/am/are', category: 'فعل' },
                { hanzi: '有', pinyin: 'yǒu', arabic: 'يملك', english: 'have', category: 'فعل' },
                { hanzi: '我', pinyin: 'wǒ', arabic: 'أنا', english: 'I/me', category: 'ضمير' },
                { hanzi: '他', pinyin: 'tā', arabic: 'هو', english: 'he', category: 'ضمير' },
                { hanzi: '她', pinyin: 'tā', arabic: 'هي', english: 'she', category: 'ضمير' },
                { hanzi: '家', pinyin: 'jiā', arabic: 'منزل', english: 'home', category: 'اسم' },
                { hanzi: '学校', pinyin: 'xuéxiào', arabic: 'مدرسة', english: 'school', category: 'اسم' },
                { hanzi: '老师', pinyin: 'lǎoshī', arabic: 'معلم', english: 'teacher', category: 'اسم' },
                { hanzi: '朋友', pinyin: 'péngyǒu', arabic: 'صديق', english: 'friend', category: 'اسم' },
                { hanzi: '一', pinyin: 'yī', arabic: 'واحد', english: 'one', category: 'رقم' },
                { hanzi: '二', pinyin: 'èr', arabic: 'اثنين', english: 'two', category: 'رقم' },
                { hanzi: '三', pinyin: 'sān', arabic: 'ثلاثة', english: 'three', category: 'رقم' },
                { hanzi: '四', pinyin: 'sì', arabic: 'أربعة', english: 'four', category: 'رقم' },
            ];

            const lessonsData = [
                {
                    id: 1,
                    title: 'الدرس الأول: التحيات الأساسية',
                    content: 'تعلم كيفية التحية والرد في اللغة الصينية',
                    vocabulary: ['你', '好', '再见']
                },
                {
                    id: 2,
                    title: 'الدرس الثاني: التعريف عن النفس',
                    content: 'كيف تقدم نفسك وتتحدث عن هويتك',
                    vocabulary: ['我', '是', '你', '他']
                },
                {
                    id: 3,
                    title: 'الدرس الثالث: الأرقام 1-10',
                    content: 'تعلم الأرقام من واحد إلى عشرة بالصينية',
                    vocabulary: ['一', '二', '三', '四', '五']
                }
            ];

            const playAudio = (text) => {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                window.speechSynthesis.speak(utterance);
            };

            const startDrawing = (e) => {
                setIsDrawing(true);
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const ctx = canvas.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
            };

            const draw = (e) => {
                if (!isDrawing || !canvasRef.current) return;
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const ctx = canvas.getContext('2d');
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.strokeStyle = '#000';
                ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
                ctx.stroke();
            };

            const stopDrawing = () => {
                setIsDrawing(false);
            };

            const clearCanvas = () => {
                const canvas = canvasRef.current;
                if (canvas) {
                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            };

            // Vocabulary Card Component
            const VocabularyCard = ({ word }) => {
                const [showArabic, setShowArabic] = useState(false);
                return (
                    <div className="bg-white rounded-lg shadow-lg p-6 max-w-md w-full">
                        <div className="text-center mb-4">
                            <div className="text-5xl font-bold text-blue-600 mb-2">{word.hanzi}</div>
                            <div className="text-xl text-gray-700 font-semibold">{word.pinyin}</div>
                        </div>
                        
                        <button
                            onClick={() => playAudio(word.pinyin)}
                            className="w-full bg-green-500 hover:bg-green-600 text-white py-2 rounded mb-4"
                        >
                            🔊 استمع
                        </button>

                        <button
                            onClick={() => setShowArabic(!showArabic)}
                            className="w-full bg-indigo-500 hover:bg-indigo-600 text-white py-2 rounded mb-4"
                        >
                            {showArabic ? 'إخفاء المعنى' : 'إظهار المعنى'}
                        </button>

                        {showArabic && (
                            <div className="bg-yellow-50 p-4 rounded mb-4 text-center">
                                <p className="text-lg text-gray-800 font-semibold">{word.arabic}</p>
                                <p className="text-sm text-gray-600">{word.english}</p>
                            </div>
                        )}

                        <div className="bg-gray-100 p-2 rounded text-sm text-center text-gray-600">
                            التصنيف: {word.category}
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-gray-100" dir="rtl">
                    {/* Navigation */}
                    <nav className="bg-gradient-to-r from-blue-600 to-indigo-600 text-white p-4 shadow-lg">
                        <div className="max-w-6xl mx-auto flex justify-between items-center">
                            <h1 className="text-2xl font-bold">🇨🇳 تعلم الصينية</h1>
                        </div>
                        <div className="max-w-6xl mx-auto flex flex-wrap gap-2 mt-4">
                            <button onClick={() => setCurrentSection('home')} className="hover:bg-blue-700 px-4 py-2 rounded">الرئيسية</button>
                            <button onClick={() => setCurrentSection('lessons')} className="hover:bg-blue-700 px-4 py-2 rounded">الدروس</button>
                            <button onClick={() => setCurrentSection('vocabulary')} className="hover:bg-blue-700 px-4 py-2 rounded">المفردات</button>
                            <button onClick={() => setCurrentSection('writing')} className="hover:bg-blue-700 px-4 py-2 rounded">الكتابة</button>
                            <button onClick={() => setCurrentSection('progress')} className="hover:bg-blue-700 px-4 py-2 rounded">التقدم</button>
                        </div>
                    </nav>

                    <main className="max-w-6xl mx-auto px-4 py-8">
                        {/* Home Section */}
                        {currentSection === 'home' && (
                            <div className="text-center">
                                <h1 className="text-5xl font-bold text-blue-600 mb-4">أهلا وسهلا!</h1>
                                <p className="text-xl text-gray-600 mb-12">منصة تفاعلية لتعلم اللغة الصينية من الصفر</p>
                                
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="bg-white p-6 rounded-lg shadow-lg card-hover cursor-pointer" onClick={() => setCurrentSection('lessons')}>
                                        <div className="text-4xl mb-4">📚</div>
                                        <h3 className="text-xl font-bold text-blue-600 mb-2">الدروس المنظمة</h3>
                                        <p className="text-gray-600">تعلم مع دروس منظمة وسهلة الفهم</p>
                                    </div>
                                    <div className="bg-white p-6 rounded-lg shadow-lg card-hover cursor-pointer" onClick={() => setCurrentSection('vocabulary')}>
                                        <div className="text-4xl mb-4">📖</div>
                                        <h3 className="text-xl font-bold text-blue-600 mb-2">المفردات</h3>
                                        <p className="text-gray-600">تعلم كلمات وتعابير جديدة</p>
                                    </div>
                                    <div className="bg-white p-6 rounded-lg shadow-lg card-hover cursor-pointer" onClick={() => setCurrentSection('writing')}>
                                        <div className="text-4xl mb-4">✏️</div>
                                        <h3 className="text-xl font-bold text-blue-600 mb-2">الكتابة</h3>
                                        <p className="text-gray-600">تدرب على كتابة الحروف الصينية</p>
                                    </div>
                                    <div className="bg-white p-6 rounded-lg shadow-lg card-hover cursor-pointer" onClick={() => setCurrentSection('progress')}>
                                        <div className="text-4xl mb-4">📊</div>
                                        <h3 className="text-xl font-bold text-blue-600 mb-2">تتبع التقدم</h3>
                                        <p className="text-gray-600">شاهد تقدمك في التعلم</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Lessons Section */}
                        {currentSection === 'lessons' && !selectedLesson && (
                            <div>
                                <h2 className="text-3xl font-bold text-blue-600 mb-8 text-center">الدروس المتاحة</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {lessonsData.map(lesson => (
                                        <div
                                            key={lesson.id}
                                            onClick={() => setSelectedLesson(lesson)}
                                            className="bg-white p-6 rounded-lg shadow-lg card-hover cursor-pointer"
                                        >
                                            <h3 className="text-xl font-bold text-blue-600 mb-2">{lesson.title}</h3>
                                            <p className="text-gray-600 mb-4">{lesson.content}</p>
                                            <button className="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                                                اختر هذا الدرس
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Lesson Detail */}
                        {currentSection === 'lessons' && selectedLesson && (
                            <div className="bg-white rounded-lg shadow-lg p-8 max-w-2xl mx-auto">
                                <h2 className="text-3xl font-bold text-blue-600 mb-6">{selectedLesson.title}</h2>
                                <p className="text-gray-800 mb-6 text-lg">{selectedLesson.content}</p>
                                
                                <div className="bg-blue-50 p-6 rounded-lg mb-6">
                                    <h3 className="font-bold text-lg mb-4 text-blue-700">الكلمات المهمة:</h3>
                                    <div className="grid grid-cols-3 gap-4">
                                        {selectedLesson.vocabulary.map((word, idx) => (
                                            <div
                                                key={idx}
                                                onClick={() => {
                                                    const fullWord = vocabularyData.find(v => v.hanzi === word);
                                                    if (fullWord) setSelectedWord(fullWord);
                                                }}
                                                className="bg-white p-3 rounded border-2 border-blue-300 text-center cursor-pointer hover:bg-blue-100"
                                            >
                                                <div className="text-2xl font-bold text-blue-600">{word}</div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <button
                                    onClick={() => setSelectedLesson(null)}
                                    className="w-full bg-gray-500 hover:bg-gray-600 text-white py-2 rounded"
                                >
                                    العودة
                                </button>
                            </div>
                        )}

                        {/* Vocabulary Section */}
                        {currentSection === 'vocabulary' && (
                            <div>
                                <h2 className="text-3xl font-bold text-blue-600 mb-8 text-center">المفردات</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {vocabularyData.map((word, idx) => (
                                        <div
                                            key={idx}
                                            onClick={() => setSelectedWord(word)}
                                            className="bg-white p-4 rounded-lg shadow hover:shadow-lg card-hover cursor-pointer text-center"
                                        >
                                            <div className="text-4xl font-bold text-blue-600 mb-2">{word.hanzi}</div>
                                            <p className="text-gray-600 font-semibold">{word.pinyin}</p>
                                            <p className="text-sm text-gray-500 mt-1">{word.arabic}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Writing Section */}
                        {currentSection === 'writing' && (
                            <div className="bg-white rounded-lg shadow-lg p-8 max-w-2xl mx-auto">
                                <h2 className="text-3xl font-bold text-blue-600 mb-6 text-center">تمرين الكتابة</h2>
                                
                                <div className="mb-6">
                                    <p className="text-lg text-gray-700 font-semibold mb-4">اكتب الحرف: <span className="text-blue-600 text-3xl">一</span></p>
                                    <p className="text-gray-600 mb-4">Yī (واحد) - رقم واحد أو واحدة</p>
                                </div>

                                <div className="bg-gray-100 p-4 rounded mb-6">
                                    <p className="text-sm text-gray-600 mb-2">اكتب على الأسفل باستخدام الماوس:</p>
                                    <canvas
                                        ref={canvasRef}
                                        width={300}
                                        height={300}
                                        onMouseDown={startDrawing}
                                        onMouseMove={draw}
                                        onMouseUp={stopDrawing}
                                        onMouseLeave={stopDrawing}
                                        className="border-2 border-blue-400 bg-white w-full"
                                    />
                                </div>

                                <button
                                    onClick={clearCanvas}
                                    className="w-full bg-yellow-500 hover:bg-yellow-600 text-white py-2 rounded mb-4"
                                >
                                    مسح
                                </button>

                                <button
                                    onClick={() => setCurrentSection('vocabulary')}
                                    className="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded"
                                >
                                    تمرين آخر
                                </button>
                            </div>
                        )}

                        {/* Progress Section */}
                        {currentSection === 'progress' && (
                            <div className="bg-white rounded-lg shadow-lg p-8 max-w-2xl mx-auto">
                                <h2 className="text-3xl font-bold text-blue-600 mb-8 text-center">تقدمك في التعلم</h2>
                                
                                <div className="space-y-6">
                                    <div className="bg-gradient-to-r from-blue-50 to-blue-100 p-6 rounded-lg">
                                        <h3 className="font-bold text-lg text-blue-700 mb-2">الدروس المكملة</h3>
                                        <div className="text-3xl font-bold text-blue-600">3 / 3</div>
                                        <div className="w-full bg-blue-200 rounded-full h-3 mt-3">
                                            <div className="bg-blue-600 h-3 rounded-full" style={{ width: '100%' }}></div>
                                        </div>
                                    </div>

                                    <div className="bg-gradient-to-r from-green-50 to-green-100 p-6 rounded-lg">
                                        <h3 className="font-bold text-lg text-green-700 mb-2">الكلمات المتعلمة</h3>
                                        <div className="text-3xl font-bold text-green-600">{vocabularyData.length}</div>
                                        <p className="text-gray-600 mt-2">واصل التعلم</p>
                                    </div>

                                    <div className="bg-gradient-to-r from-purple-50 to-purple-100 p-6 rounded-lg">
                                        <h3 className="font-bold text-lg text-purple-700 mb-2">التمارين</h3>
                                        <div className="text-3xl font-bold text-purple-600">5+</div>
                                        <p className="text-gray-600 mt-2">اكمل تمارينك يومياً</p>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Vocabulary Modal */}
                    {selectedWord && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50" onClick={() => setSelectedWord(null)}>
                            <div onClick={(e) => e.stopPropagation()}>
                                <VocabularyCard word={selectedWord} />
                                <button
                                    onClick={() => setSelectedWord(null)}
                                    className="mt-4 w-full bg-red-500 hover:bg-red-600 text-white py-2 rounded"
                                >
                                    إغلاق
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ChineseLearningSite />);
    </script>
</body>
</html>
